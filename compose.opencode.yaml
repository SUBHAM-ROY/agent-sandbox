services:
  opencode:
    extends:
      file: ./compose.common.yaml
      service: base
    build:
      context: .
      dockerfile: Dockerfile.opencode
    image: agent-sandbox/opencode
    userns_mode: keep-id
    command: ["--auto"]
    volumes:

      # --- host credentials (ro) ---
      - ${HOME}/.gitconfig:/home/coder/.gitconfig:ro

      # --- opencode config (global, from ~/.agent-sandbox) ---
      - ${HOME}/.agent-sandbox/opencode/config:/home/coder/.config/opencode:ro
      - ${HOME}/.config/opencode/skills:/home/coder/.config/opencode/skills:ro

      # --- opencode persistent state ---
      - ${HOME}/.agent-sandbox/opencode/state:/home/coder/.local/share/opencode
      - ${HOME}/.agent-sandbox/opencode/cache:/home/coder/.cache/opencode
      - ${HOME}/.agent-sandbox/opencode/tui-state:/home/coder/.local/state/opencode

      # --- anonymous volumes inside state mount ---
      - /home/coder/.local/share/opencode/repos
      - /home/coder/.local/share/opencode/log
