services:
  pi-sandbox:
    image: pi-sandbox:local
    build:
      context: .
      dockerfile: Dockerfile.pi
    user: "1000:1000" # non-root sandbox user
    userns_mode: keep-id # map host uid 1000 
    security_opt:
      - no-new-privileges:true # block privilege escalation
    cap_drop:
      - ALL # no capabilities means no root-like syscalls
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=512m
    mem_limit: 4g
    cpus: 2
    pids_limit: 256
    stdin_open: true # keeps stdin open for interactive input
    tty: true # needed for pi/gh interactive prompts
    working_dir: ${PWD} # start in repo, same path as host so worktree gitdir links resolve
    command: pi
    volumes:
      # --- repo (cwd this compose file is invoked from), mounted at the same absolute path as the host so worktree gitdir links resolve ---
      - ${PWD}:${PWD}:rw
      - ${GIT_COMMON_DIR}:${GIT_COMMON_DIR}:rw

      # --- pi auth, config, and user-level customization, persisted on the host ---
      - ${HOME}/.agent-sandbox/pi/settings:/home/node/.pi/agent:rw
      - ${HOME}/.agent-sandbox/pi/settings/extensions:/home/node/.pi/agent/extensions:ro
      - ${HOME}/.agent-sandbox/gh:/home/node/.config/gh:rw
      - ${HOME}/.gitconfig:/home/node/.gitconfig:ro

      # --- pi-generated ephemeral state: anonymous volumes, discarded with the container ---
      - /home/node/.pi/agent/tmp
