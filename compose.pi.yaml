services:
  pi-sandbox:
    extends:
      file: ./compose.common.yaml
      service: base
    image: agent-sandbox/pi:latest
    build:
      context: .
      dockerfile: Dockerfile.pi
    userns_mode: keep-id
    command: pi
    volumes:
      # persisted on host
      - ${HOME}/.agent-sandbox/pi/settings:/home/sandbox/.pi/agent:rw
      - ./pi/APPEND_SYSTEM.md:/home/sandbox/.pi/agent/APPEND_SYSTEM.md:rw
      - ./pi/skills:/home/sandbox/.pi/agent/skills:rw
      - ${HOME}/.agent-sandbox/gh:/home/sandbox/.config/gh:ro
      - ${HOME}/.gitconfig:/home/sandbox/.gitconfig:ro

      # ephemeral, discarded with --rm (pi tmp; nix via compose.common base)
      - /home/sandbox/.pi/agent/tmp
